---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: serving-lab
  labels:
    app.kubernetes.io/part-of: serving-study
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference
  namespace: serving-lab
  labels:
    app.kubernetes.io/part-of: serving-study
spec:
  gatewayClassName: serving-lab
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: inference.lab.invalid
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
  namespace: serving-lab
  labels:
    app.kubernetes.io/part-of: serving-study
spec:
  parentRefs:
  - name: inference
    sectionName: http
  hostnames:
  - inference.lab.invalid
  rules:
  - matches:
    - path:
        type: Exact
        value: /v1/completions
      headers:
      - type: Exact
        name: X-Lab-Case
        value: only-a
    backendRefs:
    - name: vllm-a
      port: 80
      weight: 100
    - name: vllm-b
      port: 80
      weight: 0
  - matches:
    - path:
        type: Exact
        value: /v1/completions
      headers:
      - type: Exact
        name: X-Lab-Case
        value: half
    backendRefs:
    - name: vllm-a
      port: 80
      weight: 50
    - name: vllm-b
      port: 80
      weight: 50
  - matches:
    - path:
        type: Exact
        value: /v1/completions
      headers:
      - type: Exact
        name: X-Lab-Case
        value: canary
    backendRefs:
    - name: vllm-a
      port: 80
      weight: 90
    - name: vllm-b
      port: 80
      weight: 10
  - matches:
    - path:
        type: Exact
        value: /v1/completions
      headers:
      - type: Exact
        name: X-Lab-Case
        value: match-a
    backendRefs:
    - name: vllm-a
      port: 80
      weight: 100
    - name: vllm-b
      port: 80
      weight: 0
  - matches:
    - path:
        type: Exact
        value: /v1/completions
      headers:
      - type: Exact
        name: X-Lab-Case
        value: match-b
    backendRefs:
    - name: vllm-a
      port: 80
      weight: 0
    - name: vllm-b
      port: 80
      weight: 100
