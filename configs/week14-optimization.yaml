schema_version: 1
week: 14
kind: optimization
baseline: configs/serving-baseline.yaml
output_root: results/week14/optimization
seed: 42
repeats: 3
requests: 200
max_inflight: 128
timeout_seconds: 120
warmup_requests: 3
rates: {low: 1.0, near_slo: null}
workloads: [short, long, mixed, shared]
prefix_families: 4
shared_tokens: 512
shapes:
  short: {prompt_tokens: 128, output_tokens: 32}
  long: {prompt_tokens: 2048, output_tokens: 32}
  shared: {prompt_tokens: 768, output_tokens: 32}
cases:
  baseline: {cache: cold, overrides: {max_num_batched_tokens: 4096}}
  chunk_256: {cache: cold, overrides: {max_num_batched_tokens: 256}}
  chunk_1024: {cache: cold, overrides: {max_num_batched_tokens: 1024}}
  eager:
    cache: cold
    comparison: execution_mode_bundle_not_graph_only
    overrides: {enforce_eager: true}
  combination:
    cache: cold
    comparison: candidate_regression_not_single_variable
    overrides: {max_num_batched_tokens: 1024, enforce_eager: true}
