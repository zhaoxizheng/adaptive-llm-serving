schema_version: 1
week: 13
kind: prefix
baseline: configs/serving-baseline.yaml
output_root: results/week13/prefix
seed: 42
repeats: 3
requests: 200
max_inflight: 128
timeout_seconds: 120
rates: {low: 1.0, near_slo: null}
workloads: [shared]
warmup_requests: 3
prefix_families: 4
shared_tokens: 512
shapes:
  short: {prompt_tokens: 128, output_tokens: 32}
  long: {prompt_tokens: 2048, output_tokens: 32}
  shared: {prompt_tokens: 768, output_tokens: 32}
cases:
  A_off: {cache: off, overrides: {enable_prefix_caching: false}}
  B_cold: {cache: cold, overrides: {enable_prefix_caching: true}}
  C_warm: {cache: warm, overrides: {enable_prefix_caching: true}}
  D_off: {cache: low_overlap, overrides: {enable_prefix_caching: false}}
  D_on: {cache: low_overlap, overrides: {enable_prefix_caching: true}}
cache_metrics:
  hits: vllm:prefix_cache_hits_total
  queries: vllm:prefix_cache_queries_total
  unit: tokens
  definition: null  # verify names/units against this build before interpreting ratios
