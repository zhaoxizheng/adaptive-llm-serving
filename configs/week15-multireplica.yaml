schema_version: 1
week: 15
kind: multireplica
baseline: configs/serving-baseline.yaml
output_root: results/week15
cluster_lock: configs/cluster-lab.yaml
seed: 42
repeats: 3
requests: 200
max_inflight: 128
timeout_seconds: 120
warmup_requests: 3
rates: {low: 1.0, near_slo: null}
workloads: [short, mixed, shared, burst]
prefix_families: 4
shared_tokens: 512
shapes:
  short: {prompt_tokens: 128, output_tokens: 32}
  long: {prompt_tokens: 2048, output_tokens: 128}
  shared: {prompt_tokens: 768, output_tokens: 32}
cases:
  single: {cache: cold, replicas: 1}
  rr: {cache: cold, replicas: 2}
  hpa_burst: {cache: cold, min_replicas: 1, max_replicas: 2, workloads: [burst]}
endpoint: http://127.0.0.1:8080/v1/completions
